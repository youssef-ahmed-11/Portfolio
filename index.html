<style>
:root{--bg:#0B0B0C;--ink:#F2EDE4;--red:#E63B1F;--gold:#C9A24B;--line:#2A2A2C;--mute:#8d887f;--d:'Bebas Neue',Impact,sans-serif;--s:'Playfair Display',Georgia,serif;--b:Inter,system-ui,sans-serif;--m:'Space Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}

body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--b);-webkit-font-smoothing:antialiased;padding-bottom:64px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:60;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media(max-width:760px){body::after{display:none}}
a{color:inherit}img{max-width:100%;display:block}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:rgba(11,11,12,.95);border-bottom:1px solid var(--line)}
.logo{font:20px var(--d);letter-spacing:.12em;text-decoration:none}
.nav nav{display:none;gap:28px}
.nav nav a,.tabbar a{font:11px var(--m);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--mute)}
.nav nav a:hover,.tabbar a:hover{color:var(--ink)}
.btn{display:inline-block;font:12px var(--m);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:12px 20px;border:1px solid var(--ink);color:var(--ink);background:none;cursor:pointer}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.off{border-style:dashed;color:var(--mute);border-color:#4a4a4d;pointer-events:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;padding:14px 8px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}

.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

h1{font:400 clamp(72px,19vw,230px)/.84 var(--d);margin:22px 0}

.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#141416;border:0;padding:0;cursor:pointer;overflow:hidden}
.vid{z-index:5;pointer-events:auto!important;position:relative!important;-webkit-tap-highlight-color:rgba(230,45,50,.25)} .vid img,.vid .play{pointer-events:none!important}

.play::after{content:"";position:absolute;left:27px;top:21px;border-left:20px solid #fff;border-block:13px solid transparent}

.ap-top,.ap-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;font:9px var(--m);letter-spacing:.12em}

.ap-art:before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(245,232,206,.16) 0 2deg,transparent 2deg 8deg)}
.ap-orbit{position:absolute;width:68%;aspect-ratio:1;border:2px solid rgba(245,232,206,.75);border-radius:50%;box-shadow:0 0 0 18px rgba(245,232,206,.08),0 0 0 38px rgba(245,232,206,.06)}
.ap-cross{position:absolute;width:140%;height:2px;background:rgba(245,232,206,.45);transform:rotate(42deg)}

.ap-mark{font:clamp(100px,19vw,176px)/.8 var(--d);letter-spacing:-.09em;color:#f5e8ce;text-shadow:7px 7px 0 #b91f2a,11px 11px 0 #211315;transform:rotate(-8deg)}
.ap-side{position:absolute;right:8px;top:12px;writing-mode:vertical-rl;font:8px var(--m);letter-spacing:.2em}
.ap-name{position:relative;z-index:2;display:flex;flex-direction:column;margin-top:auto;font:clamp(66px,12vw,108px)/.76 var(--d);letter-spacing:-.025em;text-shadow:4px 4px 0 #211315}
.ap-name span:last-child{color:#e8bd70;margin-left:12%}
.ap-bottom{justify-content:flex-start;margin-top:18px;border-top:2px solid #f5e8ce;padding-top:10px}
.ap-bottom i{width:4px;height:4px;border-radius:50%;background:#e8bd70}
.ap-index{position:absolute;right:20px;top:48%;writing-mode:vertical-rl;font:8px var(--m);letter-spacing:.16em;color:#e8bd70}
@media(max-width:860px){.about-poster{max-width:100%;min-height:420px;aspect-ratio:4/4.5}.ap-name{font-size:clamp(68px,17vw,108px)}}

.bio p{font-size:19px;margin-bottom:16px}
.draft{display:inline-block;font:11px var(--m);color:var(--red);border:1px solid var(--red);padding:4px 10px;margin-bottom:18px;letter-spacing:.1em}
.facts{margin:24px 0;border-top:1px solid var(--line)}

figcaption{font:11px var(--m);color:var(--mute);padding:6px 2px}

.rows a:hover{color:var(--red)}

.sw{position:absolute;inset:0;display:flex}

.sn{flex:1;min-width:0}.sn .slate{display:block}

.sc{font:11px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.chev{flex:none;width:11px;height:11px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);transition:transform .2s;margin:0 8px 5px 4px}

.feat{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.feat.v{grid-template-columns:minmax(0,360px) 1fr;align-items:center;gap:40px}

.finfo h3{font:400 clamp(40px,6vw,72px)/.95 var(--d);letter-spacing:.02em;margin:10px 0}

/* ABOUT — THE DIRECTOR'S MIND editorial collage */
.director-collage{position:relative;isolation:isolate;overflow:hidden;max-width:420px;min-height:510px;aspect-ratio:4/5;padding:18px;background:#e9d8b9;color:#17100e;border:5px solid #17100e;box-shadow:9px 9px 0 #e63227,15px 15px 0 #e5b86b}
.director-collage:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:radial-gradient(#17100e .8px,transparent .9px);background-size:5px 5px}
.dc-top,.dc-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;font:9px var(--m);letter-spacing:.12em}
.dc-top{border-bottom:2px solid #17100e;padding:0 0 10px}
.dc-stage{position:relative;height:365px;margin:14px 0 12px;overflow:hidden;background:linear-gradient(145deg,#a82025 0 42%,#211513 42% 100%);border:3px solid #17100e;box-shadow:5px 5px 0 #17100e}
.dc-stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 17px,rgba(245,232,207,.1) 18px 20px);mix-blend-mode:screen}

/* COMIC BOOK ART DIRECTION */
:root{--bg:#100e0d;--ink:#f6e8cf;--red:#e63227;--gold:#e5b86b;--line:#55443a;--mute:#b6a18b;--d:'Bebas Neue',Impact,sans-serif;--s:'Playfair Display',Georgia,serif;--b:Inter,system-ui,sans-serif;--m:'Space Mono',ui-monospace,monospace}
body{background-color:#100e0d;background-image:radial-gradient(rgba(230,50,39,.16) .8px,transparent .8px),linear-gradient(135deg,#100e0d 0%,#17110f 55%,#0c0b0a 100%);background-size:7px 7px,auto}
body::after{opacity:.11;mix-blend-mode:screen}
.nav{background:rgba(15,12,11,.94);border-bottom:2px solid var(--ink);box-shadow:0 5px 0 rgba(230,50,39,.7)}
.logo{font-size:25px;letter-spacing:.04em;line-height:.85;text-shadow:2px 2px 0 var(--red);transform:skew(-7deg)}

.btn{font-family:var(--d);font-size:17px;letter-spacing:.08em;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--red);transform:skew(-3deg);transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translate(2px,2px) skew(-3deg);box-shadow:1px 1px 0 var(--red)}
.btn.red{background:var(--red);border-color:var(--ink);color:#fff}
.hero{position:relative;isolation:isolate;max-width:none;width:100%;min-height:min(850px,calc(100svh - 60px));padding:clamp(55px,8vw,110px) max(6vw,24px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);align-items:center;gap:3vw;overflow:hidden;border-bottom:4px solid var(--ink);background:radial-gradient(ellipse at 72% 45%,rgba(230,50,39,.42),transparent 48%),linear-gradient(115deg,rgba(12,10,9,.98) 0 48%,rgba(80,17,14,.75) 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:radial-gradient(#f5d9b5 1px,transparent 1.4px);background-size:6px 6px;mask-image:linear-gradient(90deg,transparent,#000 65%)}
.hero::after{content:"";position:absolute;z-index:-1;right:-6vw;top:8%;width:54vw;height:78%;border:3px solid rgba(246,232,207,.7);border-radius:48% 0 0 48%;background:linear-gradient(145deg,rgba(230,50,39,.72),rgba(92,18,15,.28));transform:rotate(-5deg);box-shadow:14px 14px 0 rgba(0,0,0,.35)}
.comic-copy{position:relative;z-index:2;max-width:720px}
.hero .rec{font:13px var(--m);color:var(--gold);letter-spacing:.16em;display:inline-flex;align-items:center;padding:8px 12px;border:1px solid var(--gold);background:#17100e;transform:rotate(-2deg)}
.hero .rec i{background:var(--red);box-shadow:0 0 12px var(--red)}
.hero h1{font:400 clamp(76px,12vw,180px)/.78 var(--d);letter-spacing:-.035em;margin:30px 0 22px;text-shadow:5px 5px 0 var(--red),10px 10px 0 #080706;transform:rotate(-3deg);transform-origin:left center}
.hero h1 br+*{color:var(--red)}
.comic-issue{display:inline-block;margin-bottom:12px;padding:5px 10px;background:var(--ink);color:#17100e;border:2px solid #17100e;box-shadow:3px 3px 0 var(--red);font:11px var(--m);letter-spacing:.16em;transform:rotate(-2deg)}
.hero h1 .last-name{color:var(--red);-webkit-text-stroke:1px var(--ink)}
.hero .cred{font:italic 700 clamp(18px,2.4vw,29px) var(--s);color:var(--ink);text-shadow:2px 2px 0 #7d1712;margin:0 0 8px}
.hero .roles{font:15px/1.9 var(--m);letter-spacing:.09em;color:var(--gold);max-width:560px;margin:10px 0 28px;text-transform:uppercase}
.hero-art{position:relative;z-index:1;align-self:stretch;min-height:430px;display:flex;align-items:center;justify-content:center;transform:rotate(2deg)}
.hero-art::before{content:"";position:absolute;inset:5% 0 5% 4%;border:3px solid var(--ink);background:repeating-linear-gradient(135deg,rgba(15,10,9,.08) 0 8px,rgba(15,10,9,.32) 8px 12px);clip-path:polygon(8% 0,100% 5%,94% 100%,0 92%)}
.hero-art img{position:relative;width:min(100%,560px);height:100%;max-height:620px;object-fit:contain;filter:saturate(1.75) contrast(1.28) brightness(1.04) sepia(.12) hue-rotate(-7deg) drop-shadow(5px 5px 0 #e63227) drop-shadow(-2px -2px 0 #f6e8cf);mix-blend-mode:normal;mask-image:linear-gradient(180deg,#000 0 88%,transparent 100%);z-index:1}.hero-art::after{content:"";position:absolute;inset:5% 0 5% 4%;z-index:2;pointer-events:none;background-image:radial-gradient(rgba(16,14,13,.48) .8px,transparent 1.35px);background-size:5px 5px;opacity:.24;mix-blend-mode:multiply;clip-path:polygon(8% 0,100% 5%,94% 100%,0 92%)}
.hero-art .art-stamp{position:absolute;z-index:3;right:-1%;bottom:9%;padding:13px 18px;background:var(--ink);color:#17100e;border:2px solid #17100e;box-shadow:5px 5px 0 var(--red);font:20px/1 var(--d);transform:rotate(-8deg)}
.hero-art .art-burst{position:absolute;z-index:2;top:10%;right:3%;font:clamp(50px,8vw,100px)/1 var(--d);color:var(--ink);text-shadow:4px 4px 0 var(--red);transform:rotate(12deg)}
.hero .cta{gap:18px}
.mq{background:var(--red);border-block:3px solid var(--ink);padding:12px 0;transform:rotate(-1deg) scale(1.02);box-shadow:0 5px 0 #090807}
.mq-t{font:28px var(--d);color:#fff;letter-spacing:.1em}
.mq-t b{color:#21100d}
.sec{position:relative;border-bottom:2px solid var(--line);padding:clamp(58px,8vw,100px) 0}
.slate{font:12px var(--m);color:var(--gold);letter-spacing:.18em}
h2{font:400 clamp(48px,8vw,100px)/.86 var(--d);text-shadow:3px 3px 0 var(--red);letter-spacing:.01em}
.sub{font:italic 18px var(--s);color:#c6b39a}
.head{position:relative;padding-left:18px;border-left:5px solid var(--red)}
.head::after{content:"";position:absolute;left:-5px;bottom:-12px;width:90px;height:4px;background:var(--gold);transform:rotate(-3deg)}
.card,.case,.board{border:2px solid #6c5444;background:linear-gradient(145deg,rgba(38,27,22,.95),rgba(16,13,12,.98));box-shadow:7px 7px 0 rgba(230,50,39,.35);padding:18px;position:relative}
.card::before,.case::before{content:"";position:absolute;top:-7px;left:18px;width:42px;height:12px;background:var(--gold);opacity:.8;transform:rotate(-5deg)}
.card h3,.case h3,.board h3,.finfo h3{font:400 clamp(30px,4vw,46px)/.92 var(--d);color:var(--ink);text-shadow:2px 2px 0 var(--red)}

/* COMIC PAGE BACKDROP — printed-paper grain, halftone screens and panel gutters */
body{
  position:relative;
  background-color:#1b222b;
  background-image:
    radial-gradient(circle at 12% 16%,rgba(178,141,88,.15) 0 1.2px,transparent 1.8px),
    radial-gradient(circle at 88% 34%,rgba(228,216,194,.11) 0 1.3px,transparent 2px),
    radial-gradient(circle at 18% 76%,rgba(135,68,63,.16) 0 1.2px,transparent 1.9px),
    radial-gradient(ellipse at 5% 24%,rgba(178,141,88,.10),transparent 27%),
    radial-gradient(ellipse at 96% 64%,rgba(135,68,63,.12),transparent 30%),
    repeating-linear-gradient(0deg,transparent 0 318px,rgba(228,216,194,.075) 319px,transparent 321px 642px),
    repeating-linear-gradient(90deg,transparent 0 48%,rgba(228,216,194,.045) 48.15%,transparent 48.35% 100%),
    linear-gradient(135deg,#26313d 0%,#171d25 54%,#202a34 100%);
  background-size:7px 7px,8px 8px,7px 7px,auto,auto,auto,auto,auto;
  background-attachment:fixed;
}
/* faint angled ink frames sit behind the content like comic-page panel borders */
body::before{
  content:"";

  opacity:.28;
  background:
    linear-gradient(112deg,transparent 0 17.8%,rgba(228,216,194,.22) 17.9%,transparent 18.05% 100%) 0 0/100% 100%,
    linear-gradient(72deg,transparent 0 81.8%,rgba(178,141,88,.2) 81.95%,transparent 82.1% 100%) 0 0/100% 100%,
    repeating-linear-gradient(168deg,transparent 0 260px,rgba(10,13,17,.55) 261px,transparent 264px 520px);

}

/* SUPERHERO COMIC LAYER — separate hero treatment; About portrait remains untouched */
.hero-art{isolation:isolate}
.hero-art img{
  filter:grayscale(.18) contrast(1.34) saturate(1.22) sepia(.16) hue-rotate(-8deg)
    drop-shadow(5px 5px 0 #211315) drop-shadow(10px 10px 0 #e63227)!important;
  transform:scale(1.035);
  animation:heroPortraitIn .9s cubic-bezier(.2,.8,.2,1) both, heroFloat 6s ease-in-out 1s infinite;
}
.hero-art::before{box-shadow:inset 0 0 0 7px rgba(255,244,223,.28),9px 9px 0 #211315!important}
.hero-art .art-burst{animation:burstBob 4.5s ease-in-out infinite}
.hero-art .art-stamp{animation:stampBob 5.5s ease-in-out infinite}
.hero-props{position:absolute;inset:0;z-index:4;pointer-events:none}
.hero-prop{
  position:absolute;display:grid;place-items:center;width:66px;height:66px;
  background:#f1dfbd;border:3px solid #211315;box-shadow:5px 5px 0 #211315;
  font-size:36px;line-height:1;transform:rotate(var(--tilt,-8deg));
  animation:propDrift var(--speed,5s) ease-in-out infinite;
}
.hero-prop small{
  position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);
  white-space:nowrap;padding:4px 6px;background:#211315;color:#fff4df;
  font:800 8px/1.1 var(--m);letter-spacing:.08em
}
.hero-prop.web{top:8%;left:2%;font-size:42px;background:#fff4df}
.hero-prop.armor{top:12%;right:2%;--tilt:9deg}
.hero-prop.hammer{bottom:18%;left:1%;--tilt:-13deg}
.hero-prop.shield{bottom:14%;right:3%;border-radius:50%;background:#d9272e;color:#fff4df;border:5px solid #f1dfbd;outline:3px solid #211315}
.hero-prop.gauntlet{top:48%;left:-1%;--tilt:12deg}
.hero-prop.gem{top:3%;left:48%;width:38px;height:38px;font-size:23px;border-radius:50%;--tilt:0deg}
@keyframes heroPortraitIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1.035)}}
@keyframes heroFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes propDrift{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -9px;rotate:3deg}}
@keyframes burstBob{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes stampBob{0%,100%{translate:0 0}50%{translate:0 4px}}

<script id="neon-sound-script">
(() => {
  const player = document.getElementById("neon-sound-player");
  const audio = document.getElementById("portfolio-soundtrack");
  if (!player || !audio) return;
  const button = player.querySelector("button");
  const small = player.querySelector("small");
  const label = player.querySelector(".neon-label b");
  audio.loop = true;
  audio.volume = 0.55;
  async function play() {
    try {
      await audio.play();
      player.classList.add("is-playing");
      button.setAttribute("aria-pressed", "true");
      button.setAttribute("aria-label", "Pause portfolio soundtrack");
      label.textContent = "PORTFOLIO SOUNDTRACK";
      small.textContent = "SOUND ON";
    } catch (error) {
      small.textContent = "TAP TO PLAY";
    }
  }
  function pause() {
    audio.pause();
    player.classList.remove("is-playing");
    button.setAttribute("aria-pressed", "false");
    button.setAttribute("aria-label", "Play portfolio soundtrack");
    small.textContent = "SOUND OFF";
  }
  button.addEventListener("click", () => audio.paused ? play() : pause());
  audio.addEventListener("ended", () => { if (!audio.loop) pause(); });
  audio.addEventListener("error", () => { small.textContent = "AUDIO UNAVAILABLE"; });
})();

<script id="client-marquee-script">
(() => {
  const viewport=document.querySelector("#clients .clients");
  if(!viewport || viewport.dataset.marqueeReady) return;
  const originals=[...viewport.children];
  if(originals.length<2) return;
  viewport.dataset.marqueeReady="1";
  const track=document.createElement("div");
  track.className="client-marquee-track";
  const makeGroup=(nodes,duplicate=false)=>{
    const group=document.createElement("div");
    group.className="client-marquee-group";
    if(duplicate) group.setAttribute("aria-hidden","true");
    nodes.forEach(node=>{
      const item=duplicate?node.cloneNode(true):node;
      if(duplicate)item.querySelectorAll("a,button,[tabindex]").forEach(el=>el.setAttribute("tabindex","-1"));
      group.appendChild(item);
    });
    return group;
  };
  track.appendChild(makeGroup(originals));
  track.appendChild(makeGroup(originals,true));
  viewport.appendChild(track);
})();
</script>

  animation:viewsSweep 5s linear infinite;pointer-events:none
}

}

  content:"";display:inline-block;width:7px;height:7px;margin:0 8px 1px 0;

@keyframes viewsDot{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){

<script id="views-counter-motion-v1">
(() => {
  const metric=document.querySelector('.metrics .metric-panel:nth-child(2) .metric-number');
  if(!metric || metric.dataset.counted) return;
  metric.dataset.counted='1';
  const finalText=metric.textContent.trim();
  const target=10000000;
  const format=n=>n>=1000000?(n/1000000).toFixed( n===target ? 0 : 1 ).replace(/\.0$/,'')+'M':n>=1000?Math.floor(n/1000)+'K':String(n);
  const run=()=>{
    const start=performance.now(),duration=1700;
    const tick=now=>{
      const p=Math.min(1,(now-start)/duration);
      const eased=1-Math.pow(1-p,3);
      metric.textContent=p===1?finalText:format(Math.floor(target*eased))+'+';
      if(p<1) requestAnimationFrame(tick);
    };
    metric.textContent='0+';
    requestAnimationFrame(tick);
  };
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){metric.textContent=finalText;return;}
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(entries=>{
      if(entries.some(entry=>entry.isIntersecting)){io.disconnect();run();}
    },{threshold:.45});
    io.observe(metric);
  }else run();
})();
</script>
