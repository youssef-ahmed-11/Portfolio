<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yousef Ahmed — Content Creator, Social Media Specialist & Script Writer</title>
<meta name="description" content="Portfolio of Yousef Ahmed, a Cairo-based content creator, social media specialist and script writer.">
<meta name="theme-color" content="#0B0B0C">
<meta name="author" content="Yousef Ahmed">
<meta property="og:type" content="website">
<meta property="og:title" content="Yousef Ahmed — Content Creator, Social Media Specialist & Script Writer">
<meta property="og:description" content="Portfolio of Yousef Ahmed, a Cairo-based content creator, social media specialist and script writer.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230B0B0C'/><circle cx='16' cy='16' r='7' fill='%23E63B1F'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=Playfair+Display:ital@1&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--ink:#F2EDE4;--red:#E63B1F;--gold:#C9A24B;--line:#2A2A2C;--mute:#8d887f;--d:'Bebas Neue',Impact,sans-serif;--s:'Playfair Display',Georgia,serif;--b:Inter,system-ui,sans-serif;--m:'Space Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--b);-webkit-font-smoothing:antialiased;padding-bottom:64px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:60;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}img{max-width:100%;display:block}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:rgba(11,11,12,.95);border-bottom:1px solid var(--line)}
.logo{font:20px var(--d);letter-spacing:.12em;text-decoration:none}
.nav nav{display:none;gap:28px}
.nav nav a,.tabbar a{font:11px var(--m);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--mute)}
.nav nav a:hover,.tabbar a:hover{color:var(--ink)}
.btn{display:inline-block;font:12px var(--m);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:12px 20px;border:1px solid var(--ink);color:var(--ink);background:none;cursor:pointer}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.off{border-style:dashed;color:var(--mute);border-color:#4a4a4d;pointer-events:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;padding:14px 8px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
@media(min-width:761px){body{padding-bottom:0}.tabbar{display:none}.nav nav{display:flex}}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.hero{min-height:calc(100svh - 110px);display:flex;flex-direction:column;justify-content:center;padding-top:40px;padding-bottom:40px}
.rec{font:12px var(--m);letter-spacing:.18em;color:var(--mute)}
.rec i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:10px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
h1{font:400 clamp(72px,19vw,230px)/.84 var(--d);margin:22px 0}
.cred{font:italic 400 clamp(18px,3vw,26px) var(--s);color:var(--gold)}
.roles{font:12px/1.8 var(--m);letter-spacing:.16em;text-transform:uppercase;margin:18px 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.mq{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:14px 0}
.mq-t{display:inline-block;animation:mq 50s linear infinite;font:22px var(--d);letter-spacing:.1em}
.mq-t span{margin:0 18px}.mq-t b{color:var(--red);font-weight:400}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{padding:72px 0;border-bottom:1px solid var(--line)}
.head{margin-bottom:36px}
.slate{font:11px var(--m);letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
h2{font:400 clamp(40px,8vw,88px)/.95 var(--d);margin:10px 0 8px}
.sub{font:italic 20px var(--s);color:var(--mute);max-width:640px}
.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#141416;border:0;padding:0;cursor:pointer;overflow:hidden}
.vid.cine{aspect-ratio:2.39/1;min-height:200px}
.vid.vertical{aspect-ratio:9/16;max-width:360px}
.vid img,.vid iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.play{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:var(--red)}
.play::after{content:"";position:absolute;left:27px;top:21px;border-left:20px solid #fff;border-block:13px solid transparent}
.ph{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;border:1px dashed #4a4a4d;font:12px var(--m);letter-spacing:.16em;color:var(--mute);padding:16px;cursor:default}
.ph small{font-size:11px;letter-spacing:.06em}
.tba{color:var(--mute);font-style:italic;border-bottom:1px dashed #4a4a4d}
.grid{display:grid;gap:36px 28px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));align-items:start}
.card h3,.case h3{font:400 32px/1 var(--d);letter-spacing:.03em;margin:8px 0}
.meta{font:11px/1.8 var(--m);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.card p{margin-top:8px;color:#cfc9bf;font-size:15px}
.about{display:grid;gap:36px}
@media(min-width:861px){.about{grid-template-columns:1fr 1.5fr}}
.portrait{position:relative;aspect-ratio:4/5;background:#141416;max-width:420px}
.portrait img{width:100%;height:auto;display:block;object-fit:contain}
.portrait.has{aspect-ratio:auto}
.bio p{font-size:19px;margin-bottom:16px}
.draft{display:inline-block;font:11px var(--m);color:var(--red);border:1px solid var(--red);padding:4px 10px;margin-bottom:18px;letter-spacing:.1em}
.facts{margin:24px 0;border-top:1px solid var(--line)}
.facts div{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts .meta{min-width:110px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font:11px var(--m);border:1px solid var(--line);padding:6px 10px;letter-spacing:.06em}
.cases{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));margin-top:36px}
.case{border:1px solid var(--line);padding:24px}
.case dt{margin-top:14px}.case dd{font-size:15px;color:#cfc9bf}



figcaption{font:11px var(--m);color:var(--mute);padding:6px 2px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.95);display:grid;place-items:center;z-index:70;padding:20px;cursor:zoom-out}
.lb img{max-height:90vh;object-fit:contain}
.contact h2{font-size:clamp(48px,11vw,150px)}
.rows{margin:32px 0}
.rows>*{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;font:28px var(--d);letter-spacing:.05em}
.rows a:hover{color:var(--red)}
.rows>*{flex-wrap:wrap;align-items:baseline}.rows span:last-child{font-size:clamp(16px,4.6vw,28px);overflow-wrap:anywhere;min-width:0;text-align:right}
footer{padding:28px 20px;font:11px var(--m);letter-spacing:.1em;color:var(--mute);text-align:center}
.bio p,.case dd,.card p{white-space:pre-line}
.cvm{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.96);display:flex;flex-direction:column;padding:12px;gap:10px}
.cvh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font:12px var(--m);letter-spacing:.14em}
.cvh span:last-child{display:flex;flex-wrap:wrap;gap:8px}
.cvm iframe{flex:1;width:100%;border:0;background:#fff}
.board{padding-top:44px;margin-top:44px;border-top:1px solid var(--line)}
.board:first-child{border:0;margin-top:0;padding-top:0}
.board h3{font:400 clamp(34px,6vw,56px)/1 var(--d);letter-spacing:.03em;margin:8px 0}
.board .sub{font-size:18px}

.sw{position:absolute;inset:0;display:flex}
.sw span{flex:1;display:flex;justify-content:center;padding-top:10px}
.sw em{font:10px var(--m);writing-mode:vertical-rl;letter-spacing:.1em;font-style:normal}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px;margin-top:6px}
@media(min-width:700px){.gal{grid-template-columns:repeat(3,1fr);gap:26px 16px}}
@media(min-width:1000px){.gal{grid-template-columns:repeat(var(--cols,4),1fr)}}
.gal.photos{--cols:var(--pcols,4)}.gal.mb{--cols:var(--bcols,5)}
.gi{margin:0;min-width:0}.gi[data-lb]{cursor:zoom-in}
.gf{position:relative;aspect-ratio:3/4;background:#0f0f10;border:1px solid var(--line);overflow:hidden}
.gf img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gi:hover .gf{border-color:#4a4a4d}
.gf.note{padding:16px;overflow:auto}.gf.note p{font:italic 18px/1.35 var(--s);white-space:pre-line}
.gi figcaption{padding:10px 2px 0;color:var(--ink)}
.gn{display:block;font:400 clamp(19px,2vw,24px)/1.1 var(--d);letter-spacing:.05em;overflow-wrap:anywhere}
.gt{display:block;margin-top:4px;font:10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.feat{display:grid;gap:24px}
.feat.v{grid-template-columns:minmax(0,360px) 1fr;align-items:center;gap:40px}
@media(max-width:700px){.feat.v{grid-template-columns:1fr}}
.finfo h3{font:400 clamp(40px,6vw,72px)/.95 var(--d);letter-spacing:.02em;margin:10px 0}
.finfo p{font-size:18px;color:#cfc9bf;max-width:560px;white-space:pre-line}
.fv{display:block;width:100%;max-height:80vh;background:#000}
.clients{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:600px){.clients{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.clients{grid-template-columns:repeat(4,1fr)}}
.cl{position:relative;display:grid;place-items:center;aspect-ratio:3/2;padding:18px 18px 30px;border:1px solid var(--line);background:#111113;color:var(--ink);text-decoration:none;overflow:hidden}
.cl.light{background:var(--ink);color:#111}
.cl img{max-width:80%;max-height:68%;width:auto;height:auto;object-fit:contain}
.cl .nm{font:400 clamp(24px,3.2vw,34px)/1 var(--d);letter-spacing:.06em;text-align:center}
.cl .go{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:10px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
a.cl:hover{border-color:var(--red)}a.cl:hover .go{color:var(--red)}
.card:target h3{color:var(--red)}
.docs{display:grid;gap:8px;margin-top:14px}
.doc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border:1px solid var(--line);padding:10px 12px;background:#111113}
.doc .k{font:10px var(--m);letter-spacing:.14em;color:var(--gold);text-transform:uppercase;flex:1 1 100%}
.doc .dt{font:600 14px/1.3 var(--b);flex:1 1 100%}
.doc a{font:11px var(--m);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--red);padding-bottom:2px}
.doc a:hover{color:var(--red)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.mq-t,.rec i{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="nav">
<a class="logo" href="#top">YOUSEF AHMED</a>
<nav><a href="#about">About</a><a href="#clients" id="navcl">Clients</a><a href="#work">Work</a><a href="#strategy">Strategy</a><a href="#direction" id="navdir">Direction</a><a href="#photos">Photo</a><a href="#boards">Moodboard</a></nav>
<a class="btn red" href="#contact">Hire me</a>
</header>
<nav class="tabbar" aria-label="Quick links"><a href="#about">About</a><a href="#work">Work</a><a href="#strategy">Strategy</a><a href="#contact">Contact</a></nav>
<main id="app"><noscript><p style="padding:40px">Please enable JavaScript to view this portfolio.</p></noscript></main>
<footer>© <span id="yr"></span> <span id="fn">YOUSEF AHMED</span> · <span id="fl">CAIRO, EGYPT</span></footer>

<script src="content.js"></script>
<script>
/* ---------------- Engine (no need to edit below) ---------------- */
const S = SITE, $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tba = t => `<span class="tba">[${esc(t)}]</span>`;
const val = (x, l) => x ? esc(x) : tba(l);
const pad = i => String(i + 1).padStart(2, "0");
const yt = u => { if (!u) return ""; const m = String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : ""); };
const list = (a, n, fn) => (a && a.length ? a : Array(n).fill(null)).map(fn).join("");

const vid = (id, title, fmt) => {
  const c = "vid " + (fmt || "");
  if (!id) return `<div class="${c}"><div class="ph"><span>VIDEO PLACEHOLDER</span><small>Add a YouTube link</small></div></div>`;
  return `<button class="${c}" data-yt="${id}" aria-label="Play ${esc(title || "video")}"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'" alt=""><i class="play"></i></button>`;
};
const head = (n, t, sub) => `<div class="head rv"><div class="slate">${n}</div><h2>${t}</h2><p class="sub">${sub}</p></div>`;
const sec = (id, inner) => `<section class="sec" id="${id}"><div class="wrap">${inner}</div></section>`;
const docsHtml = d => { const ds = (d || []).filter(x => x && x.file); return ds.length ? `<div class="docs">${ds.map(x => { const k = x.kind || "Strategy", t = x.title || k + " document"; return `<div class="doc"><span class="k">${esc(k)} · PDF</span><span class="dt">${esc(t)}</span><a href="${esc(x.file)}" target="_blank" rel="noopener">View ${esc(k)} PDF ↗</a><a href="${esc(x.file)}" download="${esc(t.replace(/[^\w\u0600-\u06FF -]+/g, "").trim() || "document")}.pdf">Download</a></div>`; }).join("")}</div>` : ""; };
const project = (p, i) => { p = p || {}; return `<article class="card rv" id="p-${i}">${vid(yt(p.youtube), p.title, p.format === "vertical" ? "vertical" : "")}
<div class="meta" style="margin-top:14px">SCENE ${pad(i)}</div><h3>${val(p.title, "Project title")}</h3>
<div class="meta">${val(p.category, "Category")} · ${val(p.year, "Year")}</div><div class="meta">${val(p.role, "Your role")}</div>
<p>${p.desc ? esc(p.desc) : tba("One or two sentences on the idea")}</p>${docsHtml(p.docs)}</article>`; };

const cse = (c, i) => { c = c || {}; return `<article class="case rv"><div class="slate">CASE STUDY ${pad(i)}</div>
<h3>${c.brand || c.campaign ? esc([c.brand, c.campaign].filter(Boolean).join(" — ")) : tba("Brand & campaign name")}</h3><dl>
<dt class="meta">Challenge</dt><dd>${val(c.challenge, "To be added")}</dd><dt class="meta">Idea</dt><dd>${val(c.idea, "To be added")}</dd>
<dt class="meta">Execution</dt><dd>${val(c.execution, "To be added")}</dd>
${c.results ? `<dt class="meta">Results</dt><dd>${esc(c.results)}</dd>` : (c.brand ? "" : `<dt class="meta">Results</dt><dd>${tba("Only real, verified results")}</dd>`)}</dl>${docsHtml(c.docs)}</article>`; };

const ink = c => { const h = c.replace("#", ""), f = h.length < 6 ? h.split("").map(x => x + x).join("") : h, [r, g, b] = [0, 2, 4].map(i => parseInt(f.substr(i, 2), 16)); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#111" : "#fff"; };
const hexes = a => (a || []).map(c => String(c).trim()).filter(c => /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c)).map(c => c[0] === "#" ? c : "#" + c);
const BD = [{ tag: "Reference" }, { type: "palette" }, { tag: "Lighting" }, { tag: "Composition" }, { tag: "Texture" }];
const gcap = (n, t) => n || t ? `<figcaption>${n ? `<span class="gn">${esc(n)}</span>` : ""}${t ? `<span class="gt">${esc(t)}</span>` : ""}</figcaption>` : "";
const phCell = (a, b) => `<figure class="gi"><div class="gf"><div class="ph"><span>${esc(a)}</span><small>${esc(b)}</small></div></div></figure>`;
const cell = (it, i, label) => {
  it = it || {}; const t = it.type || "image";
  if (t === "palette") { const cs = hexes(it.colors);
    return cs.length ? `<figure class="gi"><div class="gf"><div class="sw">${cs.map(c => `<span style="background:${c};color:${ink(c)}"><em>${c.toUpperCase()}</em></span>`).join("")}</div></div>${gcap("Color palette", it.caption)}</figure>` : phCell("COLOR PALETTE", "Add hex colors in the editor"); }
  if (t === "note") return it.text ? `<figure class="gi"><div class="gf note"><p>${esc(it.text)}</p></div>${gcap(it.caption || it.tag || "Note", it.caption ? it.tag : "")}</figure>` : phCell("NOTE", "Add a lighting, composition or idea note");
  return it.src ? `<figure class="gi" data-lb="${esc(it.src)}"><div class="gf"><img loading="lazy" src="${esc(it.src)}" alt="${esc(it.caption || it.tag || "")}"></div>${gcap(it.caption, it.tag)}</figure>` : phCell(label || (it.tag || "Image").toUpperCase(), "Image placeholder");
};
const board = (b, i) => { b = b || {}; return `<article class="board">${b.title || b.related || b.desc ? `<div class="rv">${b.related ? `<span class="slate">FOR ${esc(b.related.toUpperCase())}</span>` : ""}${b.title ? `<h3>${esc(b.title)}</h3>` : ""}${b.desc ? `<p class="sub">${esc(b.desc)}</p>` : ""}</div>` : ""}<div class="gal mb rv">${(b.items && b.items.length ? b.items : BD).map((x, k) => cell(x, k)).join("")}</div></article>`; };
const pIdx = c => c.project ? S.projects.findIndex(p => p.title && p.title.toLowerCase() === c.project.toLowerCase()) : -1;
const client = c => { const tone = c.tone || (c.logo ? "light" : "dark"), pi = pIdx(c), href = pi >= 0 ? "#p-" + pi : c.url ? https(c.url) : "";
  const inner = `${c.logo ? `<img loading="lazy" src="${esc(c.logo)}" alt="${esc(c.name || "Client logo")}">` : `<span class="nm">${esc(c.name)}</span>`}${href ? `<span class="go">${pi >= 0 ? "View project ↓" : "Visit site ↗"}</span>` : ""}`;
  return href ? `<a class="cl ${tone}" href="${esc(href)}"${pi < 0 ? ' target="_blank" rel="noopener"' : ""} aria-label="${esc(c.name || "Client")}">${inner}</a>` : `<div class="cl ${tone}">${inner}</div>`; };
let _r = 0; const REEL = () => "REEL " + pad(_r++);
const row = (label, v, href) => v
  ? `<a href="${esc(href(v))}" target="_blank" rel="noopener"><span>${label}</span><span>${esc(label === "Email" || label === "WhatsApp" ? v : "Open →")}</span></a>`
  : `<div><span>${label}</span>${tba("To be added")}</div>`;

const mailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.contact.email || ""), waOk = (S.contact.whatsapp || "").replace(/\D/g, "").length >= 8, https = v => /^https?:/.test(v) ? v : "https://" + v;
const waNum = (S.contact.whatsapp || "").replace(/\D/g, "").replace(/^0/, "20"), waMsg = S.contact.whatsappMessage || "Hi " + S.name.split(" ")[0] + ", I found your portfolio and I’d like to start a project.";
const marq = S.services.map(s => `<span>${esc(s)}</span><b>●</b>`).join("");
$("#app").innerHTML = `
<section class="wrap hero" id="top">
  <div class="rec"><i></i>REC · ${esc(S.location.toUpperCase())}</div>
  <h1>${esc(S.name.toUpperCase()).replace(/ (.+)$/, "<br>$1")}</h1>
  <p class="cred">Written, shot &amp; strategized by</p>
  <p class="roles">${S.roles.map(esc).join(" · ")}</p>
  <div class="cta"><a class="btn red" href="#featured">Watch featured work</a>
  ${S.cv ? `<a class="btn" href="${esc(S.cv)}" download="Yousef-Ahmed-CV.pdf">Download CV</a>` : `<span class="btn off">CV coming soon</span>`}</div>
</section>
<div class="mq" aria-hidden="true"><div class="mq-t">${marq}${marq}</div></div>
${sec("about", head("THE LOGLINE", "ABOUT", "") +
  `<div class="about rv"><div class="portrait${S.photo ? " has" : ""}">${S.photo ? `<img src="${esc(S.photo)}" alt="Portrait of ${esc(S.name)}">` : `<div class="ph"><span>PORTRAIT PLACEHOLDER</span><small>Add a professional photo</small></div>`}</div>
  <div class="bio">${S.bioApproved ? "" : `<span class="draft">DRAFT BIO · PENDING APPROVAL</span>`}${S.bio.map(p => `<p>${esc(p)}</p>`).join("")}
  <div class="facts"><div><span class="meta">Based in</span><span>${esc(S.location)}</span></div><div><span class="meta">Industries</span><span>${S.industries.map(esc).join("<br>")}</span></div><div><span class="meta">Open to</span><span>${esc(S.openTo)}</span></div></div><div class="cta" style="margin-top:24px">${S.cv ? `<a class="btn red" href="${esc(S.cv)}" download="Yousef-Ahmed-CV.pdf">Download CV</a><button class="btn" data-cv>Preview CV</button>` : `<span class="btn off">CV coming soon</span>`}</div></div></div>`)}
${(() => { const F = S.featured || {}, fid = yt(F.youtube), ff = F.file || "", has = !!(fid || ff), fmt = F.format || (/shorts\//.test(F.youtube || "") ? "vertical" : "cine");
  const player = ff ? `<video class="fv" controls playsinline preload="metadata" src="${esc(ff)}"></video>` : vid(fid, F.title, fmt === "vertical" ? "vertical" : fmt === "wide" ? "" : "cine");
  return sec("featured", head("FEATURED PROJECT", "NOW SHOWING", has ? "A featured reel to start with." : "A placeholder for your showreel or strongest piece.") +
  `<div class="feat${fmt === "vertical" && !ff ? " v" : ""} rv"><div class="fp">${has ? player : vid("", "", "cine")}</div><div class="finfo">${has ? `<span class="slate">FEATURED REEL</span><h3>${val(F.title, "Title")}</h3>${F.desc ? `<p>${esc(F.desc)}</p>` : ""}` : `<p class="meta">FEATURED PLACEHOLDER — ${esc(F.note || "")}</p>`}</div></div>`); })()}
${(S.clients || []).filter(c => c && (c.name || c.logo)).length ? sec("clients", head("BRANDS I’VE WORKED WITH", "OUR CLIENTS", "Selected brands behind the work.") + `<div class="clients rv">${S.clients.filter(c => c && (c.name || c.logo)).map(client).join("")}</div>`) : ""}
${sec("work", head(REEL(), "VIDEO &amp; COMMERCIAL WORK", "Reels and commercial projects, tap to play.") +
  `<div class="grid">${list(S.projects, 3, project)}</div>`)}
${sec("strategy", head(REEL(), "STRATEGY &amp; CAMPAIGNS", "How the ideas are planned, researched and run.") +
  `<div class="tags rv">${S.services.map(s => `<span>${esc(s)}</span>`).join("")}</div><div class="cases">${list(S.cases, 1, cse)}</div>`)}
${S.moodboard && S.moodboard.length ? sec("direction", head(REEL(), "CREATIVE DIRECTION", "Moodboards, references and visual concepts.") +
  `<div class="gal rv">${list(S.moodboard, 6, (p, i) => cell(p && p.src ? p : null, i, "IMAGE " + pad(i)))}</div>`) : ""}
${sec("photos", head(REEL(), "PHOTOGRAPHY &amp; BEHIND THE SCENES", "Stills and set moments, each one named.") +
  `<div class="gal photos rv">${list(S.photos, 6, (p, i) => cell(p && p.src ? p : null, i, "PHOTO " + pad(i)))}</div>`)}
${sec("boards", head(REEL(), "MOODBOARD", "The references behind my work: images, color, light, texture and composition.") + list((S.boards || []).slice(0, 1), 1, board))}
<section class="sec contact" id="contact"><div class="wrap"><div class="slate rv">CLOSING CREDITS</div>
<h2 class="rv">LET’S MAKE<br>SOMETHING.</h2>
<div class="rows rv">${row("Email", mailOk ? S.contact.email : "", v => "mailto:" + v)}${row("WhatsApp", waOk ? S.contact.whatsapp : "", v => "https://wa.me/" + v.replace(/\D/g, "").replace(/^0/, "20"))}${row("LinkedIn", S.contact.linkedin, https)}${row("Instagram", S.contact.instagram, https)}</div>
${waOk ? `<a class="btn red" href="https://wa.me/${waNum}?text=${esc(encodeURIComponent(waMsg))}" target="_blank" rel="noopener">Start a project on WhatsApp</a>` : `<span class="btn off">Start a project · add WhatsApp number</span>`}
</div></section>`;

if (!(S.moodboard && S.moodboard.length)) document.getElementById("navdir")?.remove();
if (!(S.clients || []).filter(c => c && (c.name || c.logo)).length) document.getElementById("navcl")?.remove();
{ const d = S.display || {}, st = document.documentElement.style; st.setProperty("--pcols", String(d.photoColumns || 4)); st.setProperty("--bcols", String(d.boardColumns || 5)); }
$("#yr").textContent = new Date().getFullYear();
$("#fn").textContent = S.name.toUpperCase(); $("#fl").textContent = S.location.toUpperCase(); document.querySelector(".logo").textContent = S.name.toUpperCase();
document.title = S.name + " — " + S.roles.slice(0, 3).join(", ");
document.querySelectorAll(".card h3,.card p,.case h3,.case dd,.bio p,.board h3,.board .sub,.gf.note p,.gn,.finfo h3,.finfo p,.doc .dt").forEach(e => e.dir = "auto");

function openCV() {
  if (navigator.pdfViewerEnabled === false || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { window.open(S.cv, "_blank", "noopener"); return; }
  const m = document.createElement("div"); m.className = "cvm"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-label", "CV preview");
  m.innerHTML = `<div class="cvh"><span>CV · ${esc(S.name.toUpperCase())}</span><span><a class="btn" href="${esc(S.cv)}" download="Yousef-Ahmed-CV.pdf">Download</a><a class="btn" href="${esc(S.cv)}" target="_blank" rel="noopener">Open in new tab</a><button class="btn" data-x>Close</button></span></div><iframe src="${esc(S.cv)}" title="CV preview"></iframe>`;
  document.body.append(m); m.querySelector("[data-x]").focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelector(".cvm")?.remove(); document.querySelector(".lb")?.remove(); });
document.addEventListener("click", e => {
  if (e.target.closest("[data-cv]")) return openCV();
  if (e.target.closest(".cvm [data-x]")) return document.querySelector(".cvm").remove();
  const b = e.target.closest("[data-yt]");
  if (b) {
    const d = document.createElement("div"); d.className = b.className;
    d.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&rel=0&playsinline=1" title="Video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    b.replaceWith(d); return;
  }
  const l = e.target.closest("[data-lb]");
  if (l) { const o = document.createElement("div"); o.className = "lb"; o.innerHTML = `<img src="${l.dataset.lb}" alt="">`; o.onclick = () => o.remove(); document.body.append(o); }
});

const els = document.querySelectorAll(".rv");
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { rootMargin: "0px 0px -8% 0px" });
  els.forEach(x => io.observe(x));
} else els.forEach(x => x.classList.add("in"));
</script>
</body>
</html>
